<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2eb" />
    <meta name="description" content="Středisko Skuptáci Kutná Hora — interaktivní mapa lidí, jednotek a vztahů." />
    <title>Středisko Skuptáci · Kutná Hora</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("mapa-strediska-theme") || "system";
          const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen"><p>Spouštím Skupták…</p></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
