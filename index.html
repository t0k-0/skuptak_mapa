<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2eb" />
    <meta name="description" content="Středisko Skuptáci Kutná Hora — interaktivní mapa lidí, jednotek a vztahů." />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Středisko Skuptáci · Kutná Hora</title>
    <script>
      // GitHub Pages can be configured to publish the repository branch directly.
      // In that mode Vite placeholders stay untouched, so forward to the committed build.
      (() => {
        const buildBase = "%BASE_URL%";
        if (buildBase.charCodeAt(0) === 37) location.replace(new URL("./site/", location.href));
      })();
    </script>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("mapa-strediska-theme") || "system";
          const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen"><p>Budím Skuptáka</p></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
