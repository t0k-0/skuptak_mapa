<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2eb" />
    <meta name="description" content="Středisko Skuptáci Kutná Hora — interaktivní mapa lidí, jednotek a vztahů." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Středisko Skuptáci · Kutná Hora</title>
    <script>
      (() => {
        const buildBase = "./";
        if (buildBase.charCodeAt(0) === 37) location.replace(new URL("./site/", location.href));
      })();
    </script>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("mapa-strediska-theme") || "system";
          const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePreference = preference;
        } catch (_) {}
      })();
    </script>
    <style>
      :root { --boot-bg: #f4f7fa; --boot-ink: #253246; --boot-muted: #5c748c; --boot-line: rgba(37,50,70,.22); }
      :root[data-theme="dark"] { --boot-bg: #182231; --boot-ink: #f4f7fa; --boot-muted: #b6c8d8; --boot-line: rgba(120,181,235,.24); }
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: var(--boot-bg); }
      .boot-screen { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 7px; overflow: hidden; background: var(--boot-bg); color: var(--boot-ink); font-family: Arial, sans-serif; text-align: center; }
      .boot-screen::before { content: ""; position: absolute; width: min(72vw, 560px); aspect-ratio: 1; border: 1px solid var(--boot-line); border-radius: 50%; }
      .boot-visual { position: relative; display: grid; width: 94px; height: 94px; margin-bottom: 9px; place-items: center; }
      .boot-visual img { width: 62px; height: 62px; animation: boot-breathe .9s ease-in-out infinite alternate; }
      @media (prefers-color-scheme: light) { :root[data-theme="dark"] .boot-visual img { filter: invert(1); } }
      @media (prefers-color-scheme: dark) { :root[data-theme="light"] .boot-visual img { filter: invert(1); } }
      .boot-visual i { position: absolute; width: 6px; height: 6px; border: 2px solid var(--boot-bg); border-radius: 50%; background: #3978b8; box-shadow: 0 0 0 1px #3978b8; animation: boot-orbit 1.1s linear infinite; }
      .boot-visual i:nth-of-type(2) { background: #f99d1c; box-shadow: 0 0 0 1px #f99d1c; animation-delay: -.36s; }
      .boot-visual i:nth-of-type(3) { background: #7c9a42; box-shadow: 0 0 0 1px #7c9a42; animation-delay: -.72s; }
      .boot-screen strong { font-size: 21px; line-height: 1.1; }
      .boot-screen > span:last-child { color: var(--boot-muted); font: 9px/1.4 Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
      @keyframes boot-orbit { from { transform: rotate(0deg) translateX(45px) rotate(0deg); } to { transform: rotate(360deg) translateX(45px) rotate(-360deg); } }
      @keyframes boot-breathe { from { transform: scale(.94); opacity: .76; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-visual img, .boot-visual i { animation: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-BDEOCGMp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-xBl6h3Xu.css">
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-visual" aria-hidden="true"><img src="./favicon.svg" alt=""><i></i><i></i><i></i></div>
        <strong>Budím Skuptáka</strong>
        <span>Připravuji mapu</span>
      </div>
    </div>
  </body>
</html>
